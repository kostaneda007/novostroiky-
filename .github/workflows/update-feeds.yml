name: Update feeds

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Parse feeds
        run: node scripts/parse-feeds.cjs
      - name: Prerender static pages
        run: node scripts/prerender.cjs
      - name: Commit and push
        run: |
          git config user.name "feeds-bot"
          git config user.email "feeds-bot@users.noreply.github.com"
          git add src/data/properties.json public/property public/address public/data public/sitemap.xml public/llms.txt
          git diff --staged --quiet || git commit -m "chore: автообновление фидов + пререндер страниц"
          git push
